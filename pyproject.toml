[project]
name = "openenv-datacleanenv"
version = "0.1.0"
description = "DataCleanEnv - A real-world data cleaning RL environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "openai>=1.51.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "websockets>=12.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []
